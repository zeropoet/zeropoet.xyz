<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1200, initial-scale=1" />
  <title>Zeropoet social preview source</title>
  <style>
    @font-face {
      font-family: "IBM Plex Mono";
      font-weight: 400;
      src: url("assets/fonts/ibm-plex-mono-400.woff2") format("woff2");
    }

    @font-face {
      font-family: "IBM Plex Sans";
      font-weight: 400 700;
      src: url("assets/fonts/ibm-plex-sans.woff2") format("woff2");
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 1200px;
      height: 630px;
      margin: 0;
      overflow: hidden;
      background: #fff;
      color: #111;
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 55px 64px 48px;
      font-family: "IBM Plex Sans", sans-serif;
    }

    .identity {
      margin: 0;
      color: rgba(17, 17, 17, 0.64);
      font-family: "IBM Plex Mono", monospace;
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      align-self: center;
      margin: 0;
      max-width: 900px;
      font-size: 108px;
      line-height: 0.86;
      letter-spacing: -0.025em;
      text-transform: uppercase;
    }

    .marks {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 38px;
      margin: 0;
      padding: 24px 0 0;
      border-top: 1px solid rgba(17, 17, 17, 0.25);
      list-style: none;
    }

    .marks li {
      display: grid;
      justify-items: center;
      gap: 10px;
      min-width: 0;
    }

    .marks img {
      width: 62px;
      height: 62px;
      object-fit: contain;
    }

    .marks span {
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      line-height: 1.15;
      letter-spacing: 0.07em;
      text-align: center;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <p class="identity">Mancel Lindsey / Zeropoet</p>
  <h1>Void<br />Architect</h1>
  <ul class="marks" aria-label="Zeropoet projects">
    <li><img src="assets/marks/foldforge.svg" alt="" /><span>FoldForge</span></li>
    <li><img src="assets/marks/fold-kernel.svg" alt="" /><span>FoldKernel</span></li>
    <li><img src="assets/marks/foldportrait.svg" alt="" /><span>FoldPortrait</span></li>
    <li><img src="assets/marks/root-logos.svg" alt="" /><span>Root Logos</span></li>
    <li><img src="assets/marks/sovereign-standard.svg" alt="" /><span>Sovereign Standard</span></li>
    <li><img src="assets/marks/telos.svg" alt="" /><span>Telos</span></li>
  </ul>
</body>
</html>
